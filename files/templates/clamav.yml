groups:
- name: clamav.rules
    rules:
    - alert: ClamAVMalwareFound
    expr: 'clamav_scan_infected_files > 0'
    for: 1m
    labels:
        severity: critical
    annotations:
        summary: !unsafe "Malware found on {{ $labels.dns_hostname }}: {{ $value }} infected file(s)"
        summary_resolved: !unsafe "No malware detected on {{ $labels.dns_hostname }}"
        description: !unsafe "ClamAV daily scan on {{ $labels.dns_hostname }} found {{ $value }} infected file(s). Check /var/log/clamav on the host or Telegram notification for details."

    - alert: ClamAVScanError
    expr: 'clamav_scan_exit_code == 2'
    for: 1m
    labels:
        severity: warning
    annotations:
        summary: !unsafe "ClamAV scan failed with an error on {{ $labels.dns_hostname }}"
        summary_resolved: !unsafe "ClamAV scan is running without errors on {{ $labels.dns_hostname }}"
        description: !unsafe "clamscan exited with code 2 (scan error, not just infection found) on {{ $labels.dns_hostname }}. Check /var/log/clamav for details."

    - alert: ClamAVScanStale
    expr: '(time() - clamav_scan_last_run_timestamp_seconds) > 100800'
    for: 5m
    labels:
        severity: warning
    annotations:
        summary: !unsafe "ClamAV scan has not run for more than 28h on {{ $labels.dns_hostname }}"
        summary_resolved: !unsafe "ClamAV scan on {{ $labels.dns_hostname }} has resumed"
        description: !unsafe "clamav_scan_last_run_timestamp_seconds is stale — check clamav-scan.timer/service via systemctl status on {{ $labels.dns_hostname }}\n  VALUE = {{ $value }}\n  LABELS: {{ $labels }}"
